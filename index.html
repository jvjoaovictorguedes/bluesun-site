<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sun Light Soluções em Tecnologia. Energia solar fotovoltaica para residências, comércios e propriedades rurais em Uberlândia, MG. Solicite uma avaliação."
    />
    <meta name="theme-color" content="#082d55" />
    <link rel="icon" type="image/jpeg" href="/src/assets/logo.jpg" />
    <title>Sun Light | Energia Solar em Uberlândia - MG</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar "flash"
      (function () {
        var theme
        try {
          theme = localStorage.getItem('sunlight-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
